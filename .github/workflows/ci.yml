name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                php-version: ['8.5']

        name: Tests (PHP ${{ matrix.php-version }})

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: sqlite3, pdo_sqlite

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --no-interaction --no-progress

            - name: Unit tests
              run: composer test

            - name: Integration tests on a throwaway SQLite store
              run: composer test:db
